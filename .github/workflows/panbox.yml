name: PANBOX scan
on:
  push:
  workflow_dispatch:
jobs:
  panbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: curl -fsS "$PANBOX_SERVER/readyz"
        env:
          PANBOX_SERVER: ${{ vars.PANBOX_SERVER }}
      - name: Install agent and scan
        env:
          PANBOX_SERVER: ${{ vars.PANBOX_SERVER }}
          PANBOX_REPOSITORY_ID: ${{ vars.PANBOX_REPOSITORY_ID }}
          PANBOX_API_KEY: ${{ secrets.PANBOX_API_KEY }}
          PANBOX_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PANBOX_VERSION: v0.1.0-alpha.6
        run: |
          curl -fsSL "https://github.com/alterwriter/PANBOX/releases/download/${PANBOX_VERSION}/install-agent.sh" -o "$RUNNER_TEMP/install-panbox-agent.sh"
          sh "$RUNNER_TEMP/install-panbox-agent.sh" "$PANBOX_VERSION" "$RUNNER_TEMP/panbox-bin"
          "$RUNNER_TEMP/panbox-bin/panbox" go --server "$PANBOX_SERVER" --repo "$PANBOX_REPOSITORY_ID" --path . --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
